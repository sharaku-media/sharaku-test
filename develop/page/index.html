<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sharaku</title>
		<link rel="stylesheet" href="./../style//home.css" />
	</head>
	<body>
		<!-- Mobile Header -->
		<header class="mobile-header">
			<!-- logo -->
			<h1 class="logo">SHARAKU</h1>

			<!-- mobile search icon -->
			<button class="search-icon">
				<svg
					xmlns="http://www.w3.org/2000/svg"
					width="24"
					height="24"
					viewBox="0 0 24 24"
				>
					<g
						fill="none"
						stroke="currentColor"
						stroke-linecap="round"
						stroke-linejoin="round"
						stroke-width="2"
					>
						<path d="m21 21l-4.34-4.34" />
						<circle cx="11" cy="11" r="8" />
					</g>
				</svg>
			</button>
		</header>

		<main>
			<!-- MapView -->
			<div class="map-view-container">
				<div id="map" class="map-view"></div>
			</div>

			<!-- LocationView -->
			<div class="location-view-wrapper isOpening">
				<div class="search-wrapper">
					<!-- Close button -->
					<span class="close-btn">
						<svg
							xmlns="http://www.w3.org/2000/svg"
							width="40"
							height="40"
							viewBox="0 0 24 24"
						>
							<path
								fill="white"
								d="M8.7 7.3c-.4-.4-1-.4-1.4 0s-.4 1 0 1.4l3.3 3.3l-3.3 3.3c-.2.2-.3.4-.3.7c0 .6.4 1 1 1c.3 0 .5-.1.7-.3l4-4c.4-.4.4-1 0-1.4zM16 7c-.6 0-1 .4-1 1v8c0 .6.4 1 1 1s1-.4 1-1V8c0-.6-.4-1-1-1"
							/>
						</svg>
					</span>

					<div class="search-container">
						<!-- search icon -->
						<svg
							xmlns="http://www.w3.org/2000/svg"
							width="24"
							height="24"
							viewBox="0 0 24 24"
						>
							<g
								fill="none"
								stroke="currentColor"
								stroke-linecap="round"
								stroke-linejoin="round"
								stroke-width="2"
							>
								<path d="m21 21l-4.34-4.34" />
								<circle cx="11" cy="11" r="8" />
							</g>
						</svg>

						<!-- input -->
						<input type="text" placeholder="検索" />

						<!-- x icon -->
						<svg
							xmlns="http://www.w3.org/2000/svg"
							width="24"
							height="24"
							viewBox="0 0 56 56"
						>
							<path
								fill="currentColor"
								d="M28 51.906c13.055 0 23.906-10.828 23.906-23.906c0-13.055-10.875-23.906-23.93-23.906C14.899 4.094 4.095 14.945 4.095 28c0 13.078 10.828 23.906 23.906 23.906m-8.414-13.5a1.99 1.99 0 0 1-1.992-1.992c0-.539.234-1.008.609-1.36l6.984-7.03l-6.984-7.032a1.8 1.8 0 0 1-.61-1.36c0-1.077.891-1.945 1.993-1.945c.539 0 1.008.211 1.36.586l7.03 7.008l7.079-7.031c.398-.422.82-.61 1.336-.61c1.101 0 1.992.891 1.992 1.97c0 .538-.188.984-.586 1.359l-7.031 7.054l7.007 6.985c.352.375.586.844.586 1.406a1.99 1.99 0 0 1-1.992 1.992a1.93 1.93 0 0 1-1.383-.586l-7.007-7.031l-6.985 7.031a1.93 1.93 0 0 1-1.406.586"
							/>
						</svg>
					</div>
				</div>

				<div class="tagList"></div>

				<div class="location-view">
					<!-- <div id="map"></div> -->
					<!-- JS でコンテンツ情報を出す -->
				</div>
			</div>
		</main>

		<script>
			// Close Btn
			const locationViewWrapper = document.querySelector(
				".location-view-wrapper"
			);

			const closeBtn = document.querySelector(".close-btn");
			closeBtn.addEventListener("click", () => {
				if(locationViewWrapper.classList.contains("isOpening")) {
					locationViewWrapper.classList.remove("isOpening")
					locationViewWrapper.classList.add("isClosing")
				} else {
					locationViewWrapper.classList.remove("isClosing")
					locationViewWrapper.classList.add("isOpening")
				}
			});

			// Render Location Item
			const locationView = document.querySelector(".location-view");
			const locations = new Array(8).fill(null); // スポット情報の配列
			locations.forEach((item, index) => {
				const div = document.createElement("div");
				div.className = "location-item";
				div.innerHTML = `
					<div class="location-item-img-container">
						<img
							src="https://i.pinimg.com/736x/b8/5a/3b/b85a3bdde2c230bc60def5202a0b56ac.jpg"
							alt="location-img"
							class="location-item-img"
						/>
					</div>
					<div class="location-item-content">
						<h2 class="location-item-title">大阪城</h2>
						<p class="location-item-address">大阪府大阪市中央区</p>
						<div class="location-item-tags-view">
							<!-- JS でコンテンツを出す -->
						</div>
					</div>
				`;
				locationView.appendChild(div);
			});

			// Render Location Item Tag
			const locationItemTagsView = document.querySelector(
				".location-item-tags-view"
			);
			const locationTags = ["城", "夏", "観光"];
			locationTags.forEach((item) => {
				const tag = document.createElement("span");
				tag.className = "location-item-tag";
				tag.innerHTML = `${item}`;
				locationItemTagsView.appendChild(tag);
			});

			// Render Tag on Desktop site (サーチバーの下)
			const tagList = document.querySelector(".tagList");
			["", "", "", ""].forEach((item) => {
				const tag = document.createElement("span");
				tag.className = "location-item-tag";
				tag.innerHTML = `Placeholder`;
				tagList.appendChild(tag);
			});
		</script>
		<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCR_Nu28owuza4O4zP-LZUMMIelifwVP5g"></script>
		<script src="../js/home.js"></script>
	</body>
</html>
